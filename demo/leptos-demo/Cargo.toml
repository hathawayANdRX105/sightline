[package]
name = "leptos-demo"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "leptos_demo"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
